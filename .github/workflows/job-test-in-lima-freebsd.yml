name: job-test-in-lima-freebsd

on:
  workflow_call:
    inputs:
      timeout:
        required: true
        type: number
      runner:
        required: true
        type: string

jobs:
  test:
    name: "FreeBSD"
    timeout-minutes: ${{ inputs.timeout }}
    runs-on: "${{ inputs.runner }}"
    steps:
      - name: "Init: checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: "Init: lima"
        uses: lima-vm/lima-actions/setup@55627e31b78637bf254a8b2a14da8ea7d12564e5  # v1.1.0
        id: lima-actions-setup

      - name: "Init: Cache"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/lima
          key: lima-${{ steps.lima-actions-setup.outputs.version }}-freebsd

      - name: "Init: Install xorriso (required by Lima for running FreeBSD)"
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y xorriso

      - name: "Init: start the guest VM"
        run: |
          set -eux
          limactl start --plain --name=default template://freebsd
          lima freebsd-version -kru
          lima sudo pkg install -y bash go containerd
          # TODO: Pin runj until https://github.com/samuelkarp/runj/issues/72 is fixed.
          # https://github.com/containerd/nerdctl/issues/5273
          lima fetch -o /tmp/runj.pkg "https://pkg.FreeBSD.org/FreeBSD:15:amd64/release_1/All/Hashed/runj-0.2.0_5~7081553f66.pkg"
          lima sh -c 'test "$(sha256 -q /tmp/runj.pkg)" = 7081553f66757ff67e4b58872e6ae31e8070f2a1fa63d2e7edba38bb1c1abdcf'
          lima sudo pkg -o ASSUME_ALWAYS_YES=yes add /tmp/runj.pkg

      - name: "Init: copy source into the guest VM"
        run: |
          set -eux
          limactl copy -r . default:/tmp/nerdctl

      - name: "Init: build nerdctl"
        run: lima --workdir /tmp/nerdctl sudo go build -o /usr/local/bin/nerdctl ./cmd/nerdctl

      - name: "Run: test-unit"
        run: lima --workdir /tmp/nerdctl go test -v ./pkg/...

      - name: "Run: test-integration"
        timeout-minutes: 3
        run: |
          set -eux
          lima sudo containerd >containerd.log 2>&1 &
          sleep 3
          lima sudo /usr/local/bin/nerdctl run --rm --net=none dougrabson/freebsd-minimal:13 echo 'Nerdctl is up and running.'
